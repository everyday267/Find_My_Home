name: daily-tracking

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령 (run / backfill / naver / naver-probe / deploy)"
        default: run
        required: true

permissions:
  contents: write

concurrency:
  group: daily-tracking-v2
  cancel-in-progress: false

jobs:
  # 1) 국토부 실거래 — GitHub 서버에서 실행
  molit:
    if: github.event.inputs.command != 'naver' && github.event.inputs.command != 'naver-probe' && github.event.inputs.command != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect trades & compare
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.command }}" = "backfill" ]; then
            python -m tracker backfill --months 60
          else
            python -m tracker run --skip-naver
          fi

      - name: Commit data
        run: python scripts/commit_data.py "실거래 업데이트"

  # 2) 네이버 호가 — 해외 IP가 차단되므로 집 PC의 self-hosted runner에서 실행
  naver:
    needs: molit
    if: always() && github.event.inputs.command != 'backfill' && github.event.inputs.command != 'deploy'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # molit 잡이 푸시한 최신 데이터 위에서 실행

      # PC에 설치된 Python으로 가상환경 생성 (setup-python은 macOS self-hosted에서 권한 오류)
      - name: Set up Python venv
        shell: bash
        run: |
          PY=$(command -v python3.13 || command -v python3.12 || command -v python3.11 || command -v python3)
          "$PY" --version
          "$PY" -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/python -m pip install -q -r requirements.txt -r requirements-naver.txt
          .venv/bin/python -m playwright install chromium   # 최초 1회 다운로드, 이후 캐시 사용
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Probe Naver endpoints
        if: github.event.inputs.command == 'naver-probe'
        run: python -m tracker naver-probe --browser

      - name: Collect asking prices & compare
        if: github.event.inputs.command != 'naver-probe'
        run: python -m tracker run --skip-molit

      - name: Commit data
        run: python scripts/commit_data.py "호가 업데이트"

      - name: Job summary
        if: success()
        shell: python
        run: |
          import os, pathlib
          p = pathlib.Path("reports/latest.md")
          if p.exists() and os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(p.read_text(encoding="utf-8"))

  # 3) 대시보드를 비밀번호로 암호화해 Cloudflare Pages에 배포 (아이패드 등에서 보기)
  #    Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DASHBOARD_PASSWORD — 없으면 건너뜀
  deploy:
    needs: [molit, naver]
    if: always() && github.event.inputs.command != 'naver-probe'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      # 고정 salt: 바뀌면 기기에 저장된 '기억하기'가 풀림 (비밀값 아님)
      STATICRYPT_SALT: "da934e362feaef24c4f640140dbfa8e1"
      PAGES_PROJECT: find-my-home
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::notice::Cloudflare 또는 대시보드 비밀번호 Secret이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ github.ref_name }}   # 수집 잡들이 푸시한 최신 리포트

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: Encrypt dashboard
        if: steps.check.outputs.skip != 'true'
        run: |
          npx --yes staticrypt@3 reports/dashboard.html -p "$DASHBOARD_PASSWORD" -s "$STATICRYPT_SALT" \
            -d site --remember 365 --short -c false \
            --template-title "갈아타기 트래커" \
            --template-instructions "가족 공유용 대시보드입니다. 비밀번호를 입력하세요." \
            --template-button "열기" --template-placeholder "비밀번호" \
            --template-remember "이 기기에서 기억하기" --template-error "비밀번호가 틀렸습니다" \
            --template-color-primary "#0b0b0b" --template-color-secondary "#f9f9f7"
          mv site/dashboard.html site/index.html
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-cache\n' > site/_headers
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          # 복사 시 섞인 공백·줄바꿈 제거 후 형식 확인 (Account ID는 32자리 16진수)
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 형식이 올바르지 않습니다 (32자리 영문소문자+숫자여야 함, 현재 ${#CLOUDFLARE_ACCOUNT_ID}자). Zone ID나 토큰 ID가 아닌 Account ID를 넣어주세요."
            exit 1
          fi
          if ! npx --yes wrangler@3 pages project list > projects.log 2>&1; then
            cat projects.log; echo "::error::Cloudflare API 접근 실패 — 토큰 권한(Account · Cloudflare Pages · Edit)과 Account ID를 확인하세요."; exit 1
          fi
          if ! grep -q "$PAGES_PROJECT" projects.log; then
            npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main
          fi
          npx --yes wrangler@3 pages deploy site --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### 대시보드: https://${PAGES_PROJECT}.pages.dev (이번 배포: $url)" >> "$GITHUB_STEP_SUMMARY"
